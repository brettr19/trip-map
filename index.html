  var el = $('itin'); if (el.hidden) return;
  var I = D.itin, day = I.days[curDay], h = '';
  h += '<div class="itin-head"><input id="itinName" class="itin-name" type="text" placeholder="Trip name" value="' + esc(I.name || '') + '" aria-label="Trip name">' +
       '<button class="x" type="button" data-it="close" aria-label="Close itinerary">×</button></div>';
  h += '<div class="search"><input id="plSearch" type="search" placeholder="Search for a place to add" autocomplete="off" aria-label="Search for a place" value="' + esc(lastQuery) + '">' +
       '<button class="btn" type="button" data-it="search">Search</button></div><div id="plResults"></div>' +
       '<div class="row" style="margin-top:6px"><button class="btn" type="button" data-it="pincenter">Drop a pin at the map centre</button></div>';
  h += '<div class="daytabs" role="tablist">';
  I.days.forEach(function (d, i) { h += '<button type="button" role="tab" data-it="day" data-i="' + i + '" aria-selected="' + (i === curDay) + '">' + esc(dayLabel(d, i)) + '</button>'; });

  if (day) {
    var sc = schedule(day), totMi = 0, totMin = 0;

    h += '<div class="dayrow"><label>Date <input type="date" id="dDate" value="' + esc(day.date || '') + '"></label>' +
         '<label>Leave at <input type="time" id="dDepart" value="' + esc(day.depart || '') + '"></label></div>';
    var today = new Date(), iso = today.getFullYear() + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + ('0' + today.getDate()).slice(-2);
    if (day.date === iso) {

        '<div class="what"><b>' + (STOPS[s.stop] && s.kind !== 'caches' && s.kind !== 'labs' ? '<i class="ic">' + STOPS[s.stop][1] + '</i>' : '') + esc(s.name) + '</b>' +
        (r.late ? '<div class="warn">Arrives ' + clock(r.eta) + ', ' + dur(r.late) + ' after the ' + clock(hm(s.arrive)) + ' plan</div>' : '') +
        (r.short ? '<div class="warn">Less than 5 minutes here</div>' : '') +
        (s.hours ? '<div class="pnote">Hours: ' + esc(s.hours) + '</div>' : '') + (s.notes ? '<div class="pnote">' + esc(s.notes) + '</div>' : '') + '</div>' +
        '<div class="acts"><button type="button" data-it="edit" data-i="' + i + '" aria-label="Edit ' + esc(s.name) + '">Edit</button>' +
        (day.stops.length > 1 ? '<button type="button" class="grip" data-grip="' + i + '" aria-label="Drag to reorder ' + esc(s.name) + '. Arrow keys move it." title="Drag to reorder"><svg viewBox="0 0 12 20" aria-hidden="true"><circle cx="3" cy="4" r="1.6"/><circle cx="9" cy="4" r="1.6"/><circle cx="3" cy="10" r="1.6"/><circle cx="9" cy="10" r="1.6"/><circle cx="3" cy="16" r="1.6"/><circle cx="9" cy="16" r="1.6"/></svg></button>' : '') + '</div></li>';
    });
    if (day.end) h += legRow(sc.endLeg, day);
    h += placeRow(day.end, 'end', sc.end != null && day.end ? 'Arrive ' + clock(sc.end) : '');
    h += '</ol>';
    if (!day.stops.length && !day.start) h += '<p class="note">Tap a hotel, brewery, cache or any place on the map, then use Start day, Add stop or End day in its pop-up.</p>';
    h += '<div class="daytot">' + (totMi ? Math.round(totMi) + ' mi · ' + dur(totMin) + ' driving' : '') + (day.route && day.route.src === 'est' && day.route.key === wkey(day) ? ' <span class="est">estimate</span>' : '') +
      (routing[day.id] ? ' <span class="est">updating…</span>' : '') + '</div>';
    h += '<div class="row"><button class="btn" type="button" data-it="route">Update drive times</button><button class="btn" type="button" data-it="delday">Delete this day</button></div>';
  }
  h += '<h3 class="sub">Trip</h3><div class="row"><button class="btn primary" type="button" data-it="savefile">Save itinerary file</button><button class="btn" type="button" data-it="saveroutes">Save routes for Pro</button></div>' +
       '<div class="row"><button class="btn" type="button" data-it="savestops">Save places for Pro</button></div>' +
       '<p class="note">Save the itinerary file to your shared folder, then load it on the phones with Layers &gt; Load a data file. Routes and places for Pro are GeoJSON for the JSON To Features tool; places carry STOP_TYPE, NAME, URL and NOTES so they append to Planned_Points_of_Interest.</p>';
  h += '<details class="ors"><summary>Drive times setup</summary><label for="orsKey">OpenRouteService key</label><input id="orsKey" type="text" autocomplete="off" spellcheck="false" value="' + esc(orsKey()) + '">' +
       '<p class="note">' + (orsKey() ? 'Key saved on this device.' : 'Without a key, drive times are straight-line estimates at 50 mph, shown as a dotted line.') + ' Only the computer you plan on needs the key; the phones get the routes in the itinerary file.</p></details>';
  el.innerHTML = h;
}
function placeRow(p, which, when) {
  if (!p) return '<li class="ends empty"><div class="when"></div><div class="what">' + (which === 'start' ? 'No start yet' : 'No end yet') + ' <small>· tap a place, then ' + (which === 'start' ? 'Start day' : 'End day') + '</small></div></li>';
  return '<li class="ends"><div class="when">' + esc(when.replace(/^(Leave|Arrive) /, '')) + '</div><div class="what"><span class="kicker">' + (which === 'start' ? 'Start' : 'End') + '</span><b>' + esc(p.name) + '</b></div>' +
    '<div class="acts"><button type="button" data-it="clear' + which + '" aria-label="Remove ' + which + '">×</button></div></li>';
}
function legRow(leg, day) {
  if (!leg) return '';
  var note = legNote(leg);
  return '<li class="leg"><div class="when"></div><div class="what">' + Math.round(leg.mi) + ' mi · ' + dur(leg.min) + (note ? '<div class="nf">' + esc(note) + '</div>' : '') + '</div></li>';
}
function editStop(i) {
  var day = D.itin.days[curDay], s = day.stops[i]; if (!s) return;
  var h = head(dayLabel(day, curDay) + ' · stop ' + (i + 1), s.name) +
    '<div class="form"><label>Name <input id="sName" type="text" value="' + esc(s.name) + '"></label>' +
    '<label>Type <select id="sType">' + [1, 2, 3, 4, 5, 6, 7].map(function (t) { return '<option value="' + t + '"' + (s.stop === t ? ' selected' : '') + '>' + esc(STOPS[t][0]) + '</option>'; }).join('') + '</select></label>' +
    '<label>Stay (minutes) <input id="sStay" type="number" min="0" step="5" value="' + esc(s.stay != null ? s.stay : '') + '"></label>' +
    '<label>Arrive at (fixed, optional) <input id="sArrive" type="time" value="' + esc(s.arrive || '') + '"></label>' +
    '<label>Leave by (fixed, optional) <input id="sLeave" type="time" value="' + esc(s.leave || '') + '"></label>' +
    '<label>Open hours <input id="sHours" type="text" placeholder="e.g. 12–9 PM, closed Mon" value="' + esc(s.hours || '') + '"></label>' +
    '<label>Notes <textarea id="sNotes" rows="3">' + esc(s.notes || '') + '</textarea></label></div>' +
    '<div class="row"><button class="btn primary" type="button" data-act="stopsave" data-i="' + i + '">Save</button>' +
    '</div>' +
    '<div class="row"><button class="btn" type="button" data-act="stopmove" data-i="' + i + '"' + (D.itin.days.length > 1 ? '' : ' disabled') + '>Move to another day</button>' +
    '<button class="btn" type="button" data-act="stopdel" data-i="' + i + '">Remove</button></div>';
  sheet._point = null; openSheet(h);
  map.panTo([s.y, s.x]);
}
function stopAction(act, i) {
  var day = D.itin.days[curDay], s = day.stops[i]; if (!s) return;
  if (act === 'stopsave') {
    var v = function (id) { return ($(id).value || '').trim(); };
    s.name = v('sName') || s.name; s.stop = +v('sType') || s.stop; s.stay = v('sStay') === '' ? null : Math.max(0, +v('sStay')); s.arrive = v('sArrive') || null; s.leave = v('sLeave') || null;
    s.hours = v('sHours') || null; s.notes = v('sNotes') || null; closeSheet(); toast('Saved');
  } else if (act === 'stopup' && i > 0) { day.stops.splice(i - 1, 0, day.stops.splice(i, 1)[0]); editStop(i - 1); scheduleRoute(day); }
  else if (act === 'stopdown' && i < day.stops.length - 1) { day.stops.splice(i + 1, 0, day.stops.splice(i, 1)[0]); editStop(i + 1); scheduleRoute(day); }
  else if (act === 'stopdel') { day.stops.splice(i, 1); closeSheet(); scheduleRoute(day); toast('Removed ' + s.name); }
  else if (act === 'stopmove') {
    var h = head('Move ' + s.name, 'To which day?') + '<ul class="changes">';
    D.itin.days.forEach(function (d, j) { if (j !== curDay) h += '<li><button class="link" type="button" data-act="stopto" data-i="' + i + '" data-j="' + j + '" style="text-decoration:none;color:var(--fg)">' + esc(dayLabel(d, j)) + '</button><span>' + d.stops.length + ' stops</span></li>'; });
    openSheet(h + '</ul>'); return;
  }
  saveItin(); drawItin(); renderItin();
}
function itinFile() {
  var I = JSON.parse(JSON.stringify(D.itin)); I.days.forEach(function (d) { delete d._rt; });
  return JSON.stringify({ itinerary: I, built: new Date().toISOString().slice(0, 10) });
}
function routesGeoJSON() {
  var fs = [];
  D.itin.days.forEach(function (d, i) {
    if (!d.route || !d.route.line) return;
    d.route.legs.forEach(function (l, j) {
      var w = waypoints(d), seg = d.route.line.slice(l.a, l.b + 1);
      if (seg.length < 2) return;
      fs.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: seg.map(function (p) { return [p[1], p[0]]; }) },
        properties: { TRIP: D.itin.name || '', DAY: i + 1, DATE: d.date || '', LEG: j + 1, FROM_NAME: w[j] ? w[j].name : '', TO_NAME: w[j + 1] ? w[j + 1].name : '',
          MILES: Math.round(l.mi * 10) / 10, MINUTES: Math.round(l.min), SOURCE: d.route.src === 'ors' ? 'OpenRouteService' : 'Estimate' } });
    });
  });
  return JSON.stringify({ type: 'FeatureCollection', features: fs });
}
function stopsGeoJSON() {
  var fs = [];
  D.itin.days.forEach(function (d, i) {
    var sc = schedule(d), add = function (p, role, s) {
      if (!p) return;
      fs.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [p.x, p.y] }, properties: {
        STOP_TYPE: p.stop || 6, NAME: p.name || '', URL: p.url || '', NOTES: [p.hours ? 'Hours: ' + p.hours : '', p.notes || '', p.addr || ''].filter(Boolean).join(' | '),
        TRIP: D.itin.name || '', DAY: i + 1, DATE: d.date || '', ROLE: role, ARRIVE: s && s.arrive != null ? clock(s.arrive) : '', LEAVE: s && s.leave != null ? clock(s.leave) : '',
        SOURCE: p.kind === 'search' ? 'Search' : p.kind === 'pin' ? 'Pin' : 'Map data' } });
    };
    add(d.start, 'Start', null); d.stops.forEach(function (s, j) { add(s, 'Stop ' + (j + 1), sc.stops[j]); }); add(d.end, 'End', null);
  });
  return JSON.stringify({ type: 'FeatureCollection', features: fs });
}
function moveStop(from, to) {
  var day = D.itin.days[curDay]; if (!day || from === to || to < 0 || to >= day.stops.length) return false;
  day.stops.splice(to, 0, day.stops.splice(from, 1)[0]);
  saveItin(); scheduleRoute(day); drawItin(); return true;
}
function startDrag(ev, grip) {
  if (ev.button > 0) return;
  ev.preventDefault();
  var ol = grip.closest('.plan'), i = +grip.getAttribute('data-grip');
  var before = ol.querySelectorAll('li.stop')[i]; if (!before) return;
  var oldTop = before.getBoundingClientRect().top;
  ol.classList.add('dragging');                            // legs fold away so only the stops move
  var rows = [].slice.call(ol.querySelectorAll('li.stop')), row = rows[i]; if (!row) return;
  var rects = rows.map(function (r) { return r.getBoundingClientRect(); });
  var step = rows.length > 1 ? (i + 1 < rows.length ? rects[i + 1].top - rects[i].top : rects[i].top - rects[i - 1].top) : rects[i].height;
  var y0 = ev.clientY, to = i, panel = $('itin'), sc0 = panel.scrollTop, base = oldTop - rects[i].top;
  row.classList.add('lifted'); row.style.transform = 'translateY(' + base + 'px)';
  try { grip.setPointerCapture(ev.pointerId); } catch (e) {}
  var move = function (e) {
    var dy = base + e.clientY - y0 + (panel.scrollTop - sc0);
    var pr = panel.getBoundingClientRect();                // nudge the panel when dragging near its edges
    if (e.clientY < pr.top + 40) panel.scrollTop -= 8; else if (e.clientY > pr.bottom - 40) panel.scrollTop += 8;
    row.style.transform = 'translateY(' + dy + 'px)';
    var c = rects[i].top + rects[i].height / 2 + dy; to = 0;
    rows.forEach(function (r, j) { if (j !== i && rects[j].top + rects[j].height / 2 < c) to++; });
    rows.forEach(function (r, j) {
      if (j === i) return;
      var sh = (j > i && j <= to) ? -step : (j < i && j >= to) ? step : 0;
      r.style.transform = sh ? 'translateY(' + sh + 'px)' : '';
    });
  };
  var end = function () {
    grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', end); grip.removeEventListener('pointercancel', end);
    if (to !== i && moveStop(i, to)) toast('Moved ' + D.itin.days[curDay].stops[to].name);
    renderItin();
  };
  grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
}
function wireItin() {
  var el = $('itin');
  el.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-it]'); if (!b) return;
    var a = b.getAttribute('data-it'), day = D.itin.days[curDay];
    if (a === 'close') closeItin();
    else if (a === 'day') { curDay = +b.getAttribute('data-i'); drawItin(); renderItin(); var d = D.itin.days[curDay], w = waypoints(d); if (w.length) map.fitBounds(L.latLngBounds(w.map(function (p) { return [p.y, p.x]; })), { padding: [40, 40], maxZoom: 12 }); }
    else if (a === 'addday') { addDay(); drawItin(); renderItin(); }
    else if (a === 'edit') editStop(+b.getAttribute('data-i'));
    else if (a === 'clearstart' && day) { day.start = null; saveItin(); scheduleRoute(day); renderItin(); drawItin(); }
    else if (a === 'clearend' && day) { day.end = null; saveItin(); scheduleRoute(day); renderItin(); drawItin(); }
    else if (a === 'route' && day) { routeDay(day, true); renderItin(); }
    else if (a === 'delday' && day) {
      if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure', '1'); b.textContent = 'Tap again to delete'; return; }
      D.itin.days.splice(curDay, 1); curDay = Math.max(0, curDay - 1); saveItin(); drawItin(); renderItin();
    }
    else if (a === 'search') searchPlaces($('plSearch').value);
    else if (a === 'rshow') { var r = lastResults[+b.getAttribute('data-i')]; if (r) map.setView([r.y, r.x], Math.max(map.getZoom(), 14)); }
    else if (a === 'radd') { var r2 = lastResults[+b.getAttribute('data-i')]; if (r2) { map.setView([r2.y, r2.x], Math.max(map.getZoom(), 13)); addPlaceForm(L.latLng(r2.y, r2.x), r2.name, r2.stop); sheet._src = 'search'; sheet._addr = r2.addr; } }
    else if (a === 'pincenter') addPlaceForm(map.getCenter());
    else if (a === 'savestops') saveText((D.itin.name ? D.itin.name.replace(/[^\w-]+/g, '_') + '_' : '') + 'stops.geojson', stopsGeoJSON(), function () { toast('Places saved'); });
    else if (a === 'savefile') saveText((D.itin.name ? D.itin.name.replace(/[^\w-]+/g, '_') + '_' : '') + 'itinerary.json', itinFile(), function () { toast('Itinerary saved'); });
    else if (a === 'saveroutes') saveText((D.itin.name ? D.itin.name.replace(/[^\w-]+/g, '_') + '_' : '') + 'routes.geojson', routesGeoJSON(), function () { toast('Routes saved'); });
  });
  el.addEventListener('pointerdown', function (ev) { var g = ev.target.closest('[data-grip]'); if (g) startDrag(ev, g); });
  el.addEventListener('keydown', function (ev) {
    if (ev.target.id === 'plSearch' && ev.key === 'Enter') { ev.preventDefault(); searchPlaces(ev.target.value); return; }
    var g = ev.target.closest && ev.target.closest('[data-grip]');
    if (g && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
      ev.preventDefault(); var i = +g.getAttribute('data-grip'), to = i + (ev.key === 'ArrowUp' ? -1 : 1);
      if (moveStop(i, to)) { renderItin(); var n = $('itin').querySelector('[data-grip="' + to + '"]'); if (n) n.focus(); }
    }
  });
  el.addEventListener('change', function (ev) {
    var t = ev.target, day = D.itin.days[curDay];
    if (t.id === 'itinName') { D.itin.name = t.value.trim(); saveItin(); }
    else if (t.id === 'dDate' && day) { day.date = t.value; saveItin(); renderItin(); }
    else if (t.id === 'dDepart' && day) { day.depart = t.value; saveItin(); renderItin(); }
    else if (t.id === 'orsKey') { store.set('orsKey', t.value.trim()); toast(t.value.trim() ? 'Key saved on this device' : 'Key removed'); D.itin.days.forEach(function (d) { routeDay(d, true); }); }
  });
}

/* ---------- boot ---------- */
function start(data) { loadIcons().then(function () { start2(data); }); }
function start2(data) {
  D = { counties: data.counties || [], caches: data.caches || [], labs: data.labs || [], pois: data.pois || [], route: data.route || [], built: data.built || '', hist: {} };
  HKEYS.forEach(function (k) { D.hist[k] = data[k] || []; });
  D.itin = data.itinerary && data.itinerary.days ? data.itinerary : { name: '', days: [] };
  curDay = Math.min(store.get('curDay', 0), Math.max(0, D.itin.days.length - 1));
  var st = data.status || null;
  D.counties.forEach(function (c) { prepCounty(c); if (st && st[c.id] != null) c.g = +st[c.id]; });
  for (var k in edits) { var c = byId(k); if (c && edits[k].g === c.g) delete edits[k]; }
  setMode(mode); buildMap(); if (location.hostname === 'localhost') window.__tpm = { map: map, D: D }; refreshChrome(); $('loading').hidden = true;
  var flash = store.get('flash', null); if (flash) { store.set('flash', null); toast(flash); }
  if (!IN_PREVIEW && !D.counties.length && !D.caches.length && !D.route.length && !D.hist.hfound.length) showWelcome();
}
function boot() {
  wire();
  $('filePick').addEventListener('change', function (ev) { var f = ev.target.files && ev.target.files[0]; ev.target.value = ''; importFile(f); });
  if (!window.L) { $('loadingMsg').textContent = 'The map library did not load. Check your connection and reload.'; return; }
  if (IN_PREVIEW) {
    fetch('tripdata.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(start)
      .catch(function (err) { $('loadingMsg').textContent = 'The trip data did not load (' + (err && err.message || 'error') + '). Check your connection and reload.'; });
  } else {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    idbGetAll().then(start, function () { start({}); toast('This browser is blocking storage, so loaded data will not be kept.'); });
  }
}
boot();
})();
