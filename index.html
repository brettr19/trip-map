<script src="leaflet.js"></script>

/* ---------- map ---------- */

/* ---------- tapping ---------- */
function onTap(ev) {

}
function byId(id) { for (var i = 0; i < D.counties.length; i++) if (D.counties[i].id === id) return D.counties[i]; return null; }
function setStatus(c, g) {
  var e = edits[c.id];
  if (g === c.g) delete edits[c.id];
  else edits[c.id] = { g: g, was: c.g, t: new Date().toISOString() };
  if (!store.set('edits', edits)) toast('This browser is not saving changes. Save a file before closing.');
  redrawCounties(); refreshChrome();
}
function showLayers() {
  var items = [
    ['counties', 'Counties', 'Found, Not Found and Hidden', '<span class="bx"></span>'],
    ['names', 'County names', 'Shown when zoomed in', ''],
    ['route', 'Planned route', D.route.length + ' segments', '<span class="ln"></span>'],
    ['caches', 'Planned geocaches', D.caches.length.toLocaleString() + ' · blue county, red special', '<span class="pt" style="background:var(--cache)"></span>'],
    ['labs', 'Lab caches', D.labs.length.toLocaleString() + ' stops', '<span class="pt" style="background:var(--lab)"></span>'],
    ['pois', 'Points of interest', D.pois.length.toLocaleString() + ' in this data', '']
  ];
  if (groups.streets) items.push(['streets', 'Street map', 'Needs a connection', '']);
  var h = head('Map', 'Layers') + '<ul class="toggles">';
  items.forEach(function (it) {
    h += '<li><label for="lyr-' + it[0] + '"><input type="checkbox" id="lyr-' + it[0] + '" data-layer="' + it[0] + '"' + (show[it[0]] ? ' checked' : '') + '><span class="sw">' + it[3] + '</span><span>' + esc(it[1]) + '<small>' + esc(it[2]) + '</small></span></label></li>';
  });
  h += '</ul>';
  if (!IN_PREVIEW) h += '<div class="row"><button class="btn" type="button" data-act="pick">Load a data file</button></div><p class="note">' + (D.built ? 'Trip data from ' + esc(D.built) + '. ' : '') + 'Loading a file replaces only the layers that file contains. County changes made on this phone are kept.</p>';
  openSheet(h);
}
function changeList() {
  var ids = Object.keys(edits).sort(function (a, b) { return edits[a].t < edits[b].t ? 1 : -1; });
  return ids.map(function (id) { return { c: byId(id), e: edits[id], id: id }; }).filter(function (r) { return r.c; });
}
function csvText(rows) {
  var q = function (v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var out = ['LAYER,ID_FIELD,ID,NAME,STATE,GEOCACHE,STATUS,PREVIOUS,EDITED'];
  rows.forEach(function (r) {
    var us = r.c.c === 'US';
    out.push([us ? 'Geocache_Counties' : 'Geocache_Counties_Canada', us ? (r.c.x ? 'NAME' : 'GEOID') : 'CDUID', us && r.c.x ? r.c.n.replace(/ Planning Region$/, '') : r.id, r.c.n, r.c.s, r.e.g, STATUS[r.e.g], r.e.was, r.e.t].map(q).join(','));
  });
  return out.join('\r\n') + '\r\n';
}
function showExport() {
  var rows = changeList(), pend = rows.filter(function (r) { return !r.e.done; });
  var h = head('County changes', pend.length ? pend.length + (pend.length === 1 ? ' change' : ' changes') + ' to save' : 'Nothing new to save');
  if (!rows.length) h += '<p class="note">Tap a county and pick Found, Not Found or Hidden. Each change is listed here until you save it to a file for ArcGIS Pro.</p>';
  else {
    h += '<ul class="changes">';
    rows.forEach(function (r) { h += '<li class="' + (r.e.done ? 'done' : '') + '"><span>' + esc(fullName(r.c)) + '</span><span>' + STATUS[r.e.was] + ' → ' + STATUS[r.e.g] + '</span></li>'; });
    h += '</ul><div class="row"><button class="btn primary" type="button" data-act="save"' + (pend.length ? '' : ' disabled') + '>Save new changes as CSV</button><button class="btn" type="button" data-act="saveall">Save all ' + rows.length + '</button></div>' +
      '<div class="row"><button class="btn" type="button" data-act="copycsv">Copy as text</button></div>' +
      '<p class="note">Saved changes stay on the map here. The file lists each county ID with its new GEOCACHE code (0 Hidden, 1 Found, 2 Not Found).</p>';
  }
  openSheet(h);
}
function saveCsv(all) {
  var rows = changeList().filter(function (r) { return all || !r.e.done; }); if (!rows.length) return;
  var text = csvText(rows), name = 'county_changes_' + new Date().toISOString().slice(0, 10) + '.csv';
  var done = function () { rows.forEach(function (r) { r.e.done = true; }); store.set('edits', edits); redrawCounties(); refreshChrome(); showExport(); toast('Saved ' + rows.length + (rows.length === 1 ? ' change' : ' changes')); };
  if (IN_PREVIEW) {
    window.claude.use('downloads').then(function (dl) {
      if (!dl) { showCsvText(text); return; }
      return dl.save({ filename: name, data: text }).then(done);
    }).catch(function (err) { if (err && err.code === 'declined') toast('Not saved'); else showCsvText(text); });
  } else {
    try {
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); done();
    } catch (e) { showCsvText(text); }
  }
}
function showCsvText(text) {
  showExport();
  var ta = document.createElement('textarea'); ta.id = 'csvText'; ta.readOnly = true; ta.value = text; ta.setAttribute('aria-label', 'County changes as text');
  sheet.appendChild(ta); ta.focus(); ta.select();
  toast('Saving a file is not available here. Copy the text instead.');
}
function copyText(t, msg) {
  var fail = function () { toast('Could not copy. Select the text and copy it by hand.'); };
  try { navigator.clipboard.writeText(t).then(function () { toast(msg); }, fail); } catch (e) { fail(); }
}

/* ---------- chrome ---------- */
var toastTimer = null;
function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200); }
function refreshChrome() {
  var n = pendingCount(), b = $('badge'); b.hidden = !n; b.textContent = n;
  var f = 0, nf = 0; D.counties.forEach(function (c) { var g = eff(c); if (g === 1) f++; else if (g === 2) nf++; });
  var t = $('tally'); t.hidden = false;
  t.innerHTML = '<div><i class="dot" style="background:var(--found)"></i><b>' + f.toLocaleString() + '</b> <span>found</span></div><div><i class="dot" style="background:var(--notfound)"></i><b>' + nf.toLocaleString() + '</b> <span>to find</span></div>';
}
function wire() {
  sheet = $('sheet');
  sheet.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), c = b.getAttribute('data-id') ? byId(b.getAttribute('data-id')) : null;
    if (act === 'close') closeSheet();
    else if (act === 'set' && c) {
      setStatus(c, +b.getAttribute('data-g'));
      if (b.getAttribute('data-stay') && sheet._point) showPoint(sheet._point.kind, sheet._point.f); else showCounty(c);
      toast(shortName(c) + ' marked ' + STATUS[eff(c)]);
    }
    else if (act === 'undo' && c) { setStatus(c, c.g); showCounty(c); toast('Change undone'); }
    else if (act === 'save') saveCsv(false);
    else if (act === 'saveall') saveCsv(true);
    else if (act === 'pick') $('filePick').click();
    else if (act === 'copycsv') copyText(csvText(changeList()), 'Copied');
    else if (act === 'copy') copyText(b.getAttribute('data-text'), 'Coordinates copied');
  });
  sheet.addEventListener('change', function (ev) {
    var k = ev.target.getAttribute && ev.target.getAttribute('data-layer'); if (!k) return;
    show[k] = ev.target.checked; store.set('show', show);
    if (groups[k]) { if (show[k]) groups[k].addTo(map); else map.removeLayer(groups[k]); }
    drawLabels();
  });
  $('btnLayers').addEventListener('click', showLayers);
  $('btnExport').addEventListener('click', showExport);
  var me = null, watch = null, first = true, loc = $('btnLocate');
  if (!IN_PREVIEW && navigator.geolocation) {
    loc.hidden = false;
    loc.addEventListener('click', function () {
      if (watch != null) { if (me) map.setView(me.getLatLng(), Math.max(map.getZoom(), 12)); return; }
      first = true;
      watch = navigator.geolocation.watchPosition(function (p) {
        var ll = [p.coords.latitude, p.coords.longitude];
        if (!me) me = L.marker(ll, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: [16, 16], iconAnchor: [11, 11], html: '<div class="me"></div>' }) }).addTo(map); else me.setLatLng(ll);
        loc.setAttribute('aria-pressed', 'true');
        if (first) { first = false; map.setView(ll, Math.max(map.getZoom(), 11)); }
      }, function () { toast('Location is not available. Check location permission for this site.'); navigator.geolocation.clearWatch(watch); watch = null; loc.setAttribute('aria-pressed', 'false'); },
      { enableHighAccuracy: true, maximumAge: 10000 });
    });
  }
  var mq = window.matchMedia('(prefers-color-scheme: dark)'), retheme = function () { setTimeout(redrawCounties, 0); };
  if (mq.addEventListener) mq.addEventListener('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}

/* ---------- data on this phone ---------- */
var LAYERS = ['counties', 'caches', 'labs', 'pois', 'route', 'status', 'built'];
function idb() {
  return new Promise(function (res, rej) {
    var q = indexedDB.open('tpm', 1);
    q.onupgradeneeded = function () { q.result.createObjectStore('kv'); };
    q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(q.error); };
  });
}
function idbGetAll() {
  return idb().then(function (db) {
    return new Promise(function (res, rej) {
      var out = {}, tx = db.transaction('kv'), st = tx.objectStore('kv'), left = LAYERS.length;
      LAYERS.forEach(function (k) { var q = st.get(k); q.onsuccess = function () { if (q.result !== undefined) out[k] = q.result; if (!--left) res(out); }; q.onerror = function () { rej(q.error); }; });
    });
  });
}
function idbPut(obj) {
  return idb().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
      Object.keys(obj).forEach(function (k) { st.put(obj[k], k); });
      tx.oncomplete = function () { res(); }; tx.onerror = tx.onabort = function () { rej(tx.error); };
    });
  });
}
function num(v) { v = parseFloat(v); return isFinite(v) ? v : null; }
function str(v) { return v == null ? null : String(v).trim() || null; }
function fromGeoJSON(gj) {            // a layer exported from ArcGIS Pro with Features To JSON (GeoJSON, WGS 1984)
  var fs = gj.features || [], first = null, i;
  for (i = 0; i < fs.length; i++) if (fs[i] && fs[i].geometry) { first = fs[i]; break; }
  if (!first) throw new Error('That file has no features in it.');
  var t = first.geometry.type, P = first.properties || {}, c0 = first.geometry.coordinates;
  var probe = t === 'Point' ? c0 : t === 'LineString' ? c0[0] : t === 'MultiLineString' ? c0[0][0] : null;
  if (probe && (Math.abs(probe[0]) > 180 || Math.abs(probe[1]) > 90)) throw new Error('Coordinates are not latitude and longitude. Export with "Project to WGS_1984" checked.');
  var pt = function (f) { var c = f.geometry && f.geometry.type === 'Point' ? f.geometry.coordinates : null; return c ? { x: +c[0].toFixed(5), y: +c[1].toFixed(5) } : null; };
  if (t === 'LineString' || t === 'MultiLineString') {
    var route = [];
    fs.forEach(function (f) {
      if (!f.geometry) return; var p = f.properties || {};
      var parts = f.geometry.type === 'LineString' ? [f.geometry.coordinates] : f.geometry.type === 'MultiLineString' ? f.geometry.coordinates : [];
      parts.forEach(function (ln) { if (ln.length > 1) route.push({ p: ln.map(function (c) { return [+c[1].toFixed(5), +c[0].toFixed(5)]; }), trip: str(p.TRIP) || '', notes: str(p.NOTES) || '' }); });
    });
    return { route: route };
  }
  if (t !== 'Point') throw new Error('County outlines are too large to load this way. Use the starter data file for counties.');
  var out = [];
  if ('STOP_TYPE' in P) {
    fs.forEach(function (f) { var q = pt(f), p = f.properties || {}; if (q) { q.stop = num(p.STOP_TYPE); q.name = str(p.NAME); q.url = str(p.URL); q.notes = str(p.NOTES); q.g = num(p.G_RATING); q.at = num(p.AT_RATING); q.len = num(p.TRAIL_LEN); q.beer = num(p.AVG_BEER_RTG); out.push(q); } });
    return { pois: out };
  }
  if ('code' in P && ('difficulty' in P || 'terrain' in P)) {
    fs.forEach(function (f) { var q = pt(f), p = f.properties || {}; if (q) { q.code = str(p.code); q.name = str(p.name) || ''; q.type = str(p.type); q.d = num(p.difficulty); q.t = num(p.terrain); q.size = str(p.container); q.owner = str(p.owner); q.fav = num(p.favoritePoints); q.hint = str(p.encodedHints); q.url = str(p.url); q.note = str(p.myNote); q.cat = num(p.archived); q.st = str(p.state); q.avail = num(p.available); out.push(q); } });
    return { caches: out };
  }
  if ('Descript' in P || ('Name' in P && 'Comment' in P)) {
    fs.forEach(function (f) { var q = pt(f), p = f.properties || {}; if (q) { q.name = str(p.Name) || ''; q.desc = str(p.Descript) || ''; q.note = str(p.Comment) || ''; out.push(q); } });
    return { labs: out };
  }
  throw new Error('This point layer was not recognized. Expected planned geocaches, lab caches or points of interest.');
}
var NAMES = { counties: 'counties', caches: 'geocaches', labs: 'lab cache stops', pois: 'points of interest', route: 'route segments', status: 'county statuses' };
function importFile(file) {
  if (!file) return;
  if (file.size > 60 * 1024 * 1024) { toast('That file is too large for a phone (over 60 MB).'); return; }
  toast('Reading ' + file.name + '…');
  file.text().then(function (txt) {
    var j = JSON.parse(txt), put = {};
    if (j && j.type === 'FeatureCollection') put = fromGeoJSON(j);
    else if (j && typeof j === 'object') LAYERS.forEach(function (k) { if (j[k] != null) put[k] = j[k]; });
    var got = Object.keys(put).filter(function (k) { return NAMES[k]; });
    if (!got.length) throw new Error('No map layers were found in that file.');
    if (!put.built) put.built = new Date().toISOString().slice(0, 10);
    return idbPut(put).then(function () {
      var msg = got.map(function (k) { var n = Array.isArray(put[k]) ? put[k].length : Object.keys(put[k]).length; return n.toLocaleString() + ' ' + NAMES[k]; }).join(', ');
      store.set('flash', 'Loaded ' + msg); location.reload();
    });
  }).catch(function (err) {
    toast(err instanceof SyntaxError ? 'That file is not valid JSON or GeoJSON.' : (err && err.message) || 'The file could not be loaded.');
  });
}
function showWelcome() {
  openSheet(head('Trip Planning Map', 'Load your trip data') + '<p class="note">This phone has no map data yet. Choose the trip data file you saved to Files or iCloud Drive. It stays on this phone and is never uploaded.</p><div class="row"><button class="btn primary" type="button" data-act="pick">Choose data file</button></div>');
}

/* ---------- boot ---------- */
function start(data) {
  D = { counties: data.counties || [], caches: data.caches || [], labs: data.labs || [], pois: data.pois || [], route: data.route || [], built: data.built || '' };
  var st = data.status || null;
  D.counties.forEach(function (c) { prepCounty(c); if (st && st[c.id] != null) c.g = +st[c.id]; });
  for (var k in edits) { var c = byId(k); if (c && edits[k].g === c.g) delete edits[k]; }
  buildMap(); refreshChrome(); $('loading').hidden = true;
  var flash = store.get('flash', null); if (flash) { store.set('flash', null); toast(flash); }
  if (!IN_PREVIEW && !D.counties.length && !D.caches.length && !D.route.length) showWelcome();
}
function boot() {
  wire();
  $('filePick').addEventListener('change', function (ev) { var f = ev.target.files && ev.target.files[0]; ev.target.value = ''; importFile(f); });
  if (!window.L) { $('loadingMsg').textContent = 'The map library did not load. Check your connection and reload.'; return; }
  if (IN_PREVIEW) {
    fetch('tripdata.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(start)
      .catch(function (err) { $('loadingMsg').textContent = 'The trip data did not load (' + (err && err.message || 'error') + '). Check your connection and reload.'; });
  } else {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    idbGetAll().then(start, function () { start({}); toast('This browser is blocking storage, so loaded data will not be kept.'); });
  }
}
boot();
})();
</script>
